services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy

  web:
    build: .
    expose:
      - "5000"
    environment:
      APP_TITLE: "방명록"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "devops1234"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request;
        urllib.request.urlopen(
        'http://localhost:5000/readyz')"]   # app.py 참고
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./app.py
        - action: rebuild
          path: ./templates

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "devops1234", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - "REDISCLI_AUTH=devops1234 redis-cli --raw ping | grep -qx PONG"
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
